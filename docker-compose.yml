# Crousty & Kebab — démarrage complet :  docker compose up --build -d
name: crousty-kebab

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crousty}
      POSTGRES_USER: ${POSTGRES_USER:-crousty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans le fichier .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      LOBBY_CLOSED_HOURS: ${LOBBY_CLOSED_HOURS:-12}
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-crousty}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-crousty}?schema=public
      # Même origine derrière Nginx : CORS désactivé sauf si une origine est fournie.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      RATE_LIMIT_CREATE_MAX: ${RATE_LIMIT_CREATE_MAX:-30}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-48}
      CROUSTY_PHONE: ${CROUSTY_PHONE:-0554796424}
      RUN_MIGRATIONS: "true"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
